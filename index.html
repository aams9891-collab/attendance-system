<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الحضور والانصراف</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-4 flex flex-col items-center">
    <div class="w-full max-w-md bg-slate-800 p-6 rounded-xl shadow-lg border border-slate-700">
        <h1 class="text-2xl font-bold text-center mb-6 text-amber-400">نظام الحضور والانصراف</h1>
        
        <div class="mb-6 border-b border-slate-700 pb-4">
            <label class="block text-sm font-medium mb-2">إدارة الموظفات:</label>
            <div class="flex gap-2 mb-2">
                <input type="text" id="newEmpInput" placeholder="اكتبي اسم الموظفة..." class="w-full p-2 rounded bg-slate-700 text-white text-sm">
                <button id="addBtn" class="bg-amber-500 text-black font-bold px-4 py-2 rounded text-sm">إضافة</button>
            </div>
            <div class="flex gap-2">
                <select id="empSelect" class="w-full p-2 rounded bg-slate-700 text-white text-sm"></select>
                <button id="delBtn" class="bg-rose-500 px-3 py-2 rounded text-white text-sm">حذف</button>
                <button id="resetBtn" class="bg-amber-600 px-3 py-2 rounded text-white text-sm">إلغاء الحظر</button>
            </div>
        </div>

        <div class="flex gap-4 mb-6">
            <button id="inBtn" class="w-1/2 bg-emerald-500 py-3 rounded-lg font-bold text-lg">تسجيل دخول</button>
            <button id="outBtn" class="w-1/2 bg-rose-500 py-3 rounded-lg font-bold text-lg">تسجيل خروج</button>
        </div>

        <div id="statusMsg" class="text-center my-2 text-sm text-amber-300 font-bold hidden"></div>

        <div>
            <h2 class="font-bold mb-3 border-b border-slate-700 pb-1">السجل اليومي المحلي</h2>
            <table class="w-full text-right text-sm">
                <thead>
                    <tr class="text-slate-400 border-b border-slate-700">
                        <th class="pb-2">الموظفة</th>
                        <th class="pb-2">النوع</th>
                        <th class="pb-2">الوقت والتاريخ</th>
                    </tr>
                </thead>
                <tbody id="logTable">
                    <tr><td colspan="3" class="py-3 text-center text-slate-500">لا يوجد تسجيلات اليوم</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
    // ضع رابط سكريبت جوجل الخاص بك كاملاً بين علامات التنصيص
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbysprjKnHV4x9UmfdctpgAi_AjPilYI4BXBNJzs136YmPty0hRvKjb26E9oPx--2Cbkvg/exec";
    const ADMIN_PASS = "1234";

    document.addEventListener('DOMContentLoaded', function() {
        const empSelect = document.getElementById('empSelect');
        const newEmpInput = document.getElementById('newEmpInput');
        const addBtn = document.getElementById('addBtn');
        const delBtn = document.getElementById('delBtn');
        const resetBtn = document.getElementById('resetBtn');
        const inBtn = document.getElementById('inBtn');
        const outBtn = document.getElementById('outBtn');
        const logTable = document.getElementById('logTable');
        const statusMsg = document.getElementById('statusMsg');

        function showStatus(text) {
            statusMsg.textContent = text;
            statusMsg.classList.remove('hidden');
        }

        function hideStatus() {
            statusMsg.classList.add('hidden');
        }

        function loadEmployees() {
            empSelect.innerHTML = '';
            const savedEmps = JSON.parse(localStorage.getItem('salon_employees') || '[]');
            savedEmps.forEach(name => {
                const opt = document.createElement('option');
                opt.value = name;
                opt.textContent = name;
                empSelect.appendChild(opt);
            });
        }

        function saveEmployeesList() {
            const emps = [];
            for (let i = 0; i < empSelect.options.length; i++) {
                emps.push(empSelect.options[i].value);
            }
            localStorage.setItem('salon_employees', JSON.stringify(emps));
        }

        loadEmployees();

        if (addBtn) {
            addBtn.onclick = function() {
                if (prompt('رمز المرور الإداري:') !== ADMIN_PASS) return alert('رمز المرور غير صحيح!');
                const name = newEmpInput.value.trim();
                if (!name) return alert('يرجى كتابة اسم الموظفة');
                
                const opt = document.createElement('option');
                opt.value = name; opt.textContent = name;
                empSelect.appendChild(opt); 
                empSelect.value = name;
                newEmpInput.value = '';
                saveEmployeesList();
                alert('تم حفظ الموظفة بنجاح!');
            };
        }

        if (delBtn) {
            delBtn.onclick = function() {
                if (empSelect.options.length === 0) return;
                if (prompt('رمز المرور الإداري:') !== ADMIN_PASS) return alert('رمز المرور غير صحيح!');
                empSelect.remove(empSelect.selectedIndex);
                saveEmployeesList();
                alert('تم حذف الموظفة!');
            };
        }

        if (resetBtn) {
            resetBtn.onclick = function() {
                if (!empSelect.value) return;
                if (prompt('رمز المرور الإداري:') !== ADMIN_PASS) return alert('رمز المرور غير صحيح!');
                const today = new Date().toISOString().slice(0, 10);
                localStorage.removeItem('att_' + empSelect.value + 'تسجيل دخول' + today);
                localStorage.removeItem('att_' + empSelect.value + 'تسجيل خروج' + today);
                alert('تم إلغاء الحظر!');
            };
        }

        function register(type) {
            const name = empSelect.value;
            if (!name) return alert('اختاري الموظفة أولاً');

            const now = new Date();
            const todayStr = now.toISOString().slice(0, 10);
            const recordKey = 'att_' + name + '' + type + '' + todayStr;

            if (localStorage.getItem(recordKey)) {
                return alert('تم التسجيل اليوم بالفعل!');
            }

            if (!navigator.geolocation) {
                return alert('متصفحك لا يدعم تحديد الموقع الجغرافي');
            }

            showStatus('⏳ جاري تحديد الموقع الجغرافي...');

            const options = {
                enableHighAccuracy: false, // سرعة تحديد الموقع للجوال
                timeout: 10000,            // أقصى مدة انتظار 10 ثوانٍ حتى لا يعلق الجوال
                maximumAge: 0
            };

            navigator.geolocation.getCurrentPosition(function(position) {
                showStatus('⏳ جاري إرسال البيانات لسجل جوجل...');
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                const timeStr = now.toLocaleDateString('ar-SA') + ' - ' + now.toLocaleTimeString('ar-SA');

                // إرسال البيانات لرابط جوجل سكريبت
                fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({ employee: name, type: type, time: timeStr, lat: lat, lng: lng })
                }).then(() => {
                    hideStatus();
                    localStorage.setItem(recordKey, "true");

                    if (logTable && logTable.rows[0] && logTable.rows[0].cells.length === 1) logTable.innerHTML = '';
                    const rowClass = type === 'تسجيل دخول' ? 'text-emerald-400' : 'text-rose-400';
                    if (logTable) {
                        logTable.innerHTML = '<tr class="border-b border-slate-700/50"><td class="py-3 font-bold text-white">' + name + '</td><td class="py-3 ' + rowClass + '">' + type + '</td><td class="py-3 text-slate-300">' + timeStr + '</td></tr>' + logTable.innerHTML;
                    }
                    alert('تم التسجيل بنجاح والحفظ في شيت جوجل!');
                }).catch(err => {
                    hideStatus();
                    alert('حدث خطأ أثناء الإرسال لجوجل شيت، يرجى المحاولة مجدداً.');
                });

            }, function(error) {
                hideStatus();
                if (error.code === error.TIMEOUT) {
                    alert('تأخر الجوال في استجابة الـ GPS. تأكدي من تفعيل "الموقع الجغرافي" في الجوال واختباري مجدداً.');
                } else if (error.code === error.PERMISSION_DENIED) {
                    alert('يرجى السماح للمتصفح بفتح الموقع الجغرافي (GPS) من إعدادات الجوال.');
                } else {
                    alert('تعذر الحصول على الموقع الجغرافي.');
                }
            }, options);
        }

        if (inBtn) inBtn.onclick = function() { register('تسجيل دخول'); };
        if (outBtn) outBtn.onclick = function() { register('تسجيل خروج'); };
    });
    </script>
</body>
</html>
