<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الحضور والانصراف - الصالون</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">

    <div class="bg-slate-800 p-6 rounded-2xl shadow-xl w-full max-w-md border border-slate-700">
        <h1 class="text-2xl font-bold text-center mb-6 text-amber-400">نظام الحضور والانصراف</h1>

        <!-- إدارة الموظفات -->
        <div class="mb-5 bg-slate-700/50 p-4 rounded-xl border border-slate-600">
            <label class="block text-slate-300 mb-2 font-bold text-sm">إدارة الموظفات (خاص بالإدارة):</label>
            <div class="flex gap-2 mb-3">
                <input type="text" id="newEmpInput" placeholder="اكتبي اسم الموظفة..." class="flex-1 p-2.5 rounded-lg bg-slate-800 text-white border border-slate-600 text-sm focus:outline-none focus:border-amber-400">
                <button type="button" id="addBtn" class="bg-amber-500 hover:bg-amber-400 text-slate-900 font-bold px-4 py-2 rounded-lg text-sm transition">إضافة</button>
            </div>

            <div class="flex gap-2">
                <select id="empSelect" class="flex-1 p-2.5 rounded-lg bg-slate-800 text-white border border-slate-600 text-sm focus:outline-none focus:border-amber-400">
                    <option value="سارة">سارة</option>
                    <option value="نورة">نورة</option>
                    <option value="أمل">أمل</option>
                </select>
                <button type="button" id="delBtn" class="bg-rose-600 hover:bg-rose-500 text-white font-semibold px-3 py-2 rounded-lg text-xs transition">حذف</button>
                <button type="button" id="resetBtn" class="bg-amber-600 hover:bg-amber-500 text-white font-semibold px-3 py-2 rounded-lg text-xs transition">إلغاء الحظر</button>
            </div>
        </div>

        <!-- أزرار التسجيل -->
        <div class="grid grid-cols-2 gap-4 mb-6">
            <button type="button" id="inBtn" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl transition shadow-lg active:scale-95">
                تسجيل دخول
            </button>
            <button type="button" id="outBtn" class="bg-rose-600 hover:bg-rose-500 text-white font-bold py-3 rounded-xl transition shadow-lg active:scale-95">
                تسجيل خروج
            </button>
        </div>

        <!-- جدول السجلات -->
        <div class="overflow-x-auto">
            <table class="w-full text-right text-sm">
                <thead>
                    <tr class="text-slate-400 border-b border-slate-700">
                        <th class="py-2">الموظفة</th>
                        <th class="py-2">النوع</th>
                        <th class="py-2">الوقت والتاريخ</th>
                    </tr>
                </thead>
                <tbody id="logTable">
                    <tr>
                        <td colspan="3" class="py-4 text-center text-slate-500">لا توجد سجلات جديدة</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- نموذج إرسال خفي لضمان وصول البيانات لـ Google Sheets بدون مشاكل -->
    <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>
    <form id="gform" target="hidden_iframe" method="POST" action="" style="display:none;">
        <input type="hidden" name="employee" id="form_employee">
        <input type="hidden" name="type" id="form_type">
        <input type="hidden" name="time" id="form_time">
    </form>

    <script>
    // ضعي رابط Google Apps Script الخاص بكِ هنا بين العلامتين " "
    const GOOGLE_SCRIPT_URL = "ضع_الرابط_هنا";
    const ADMIN_PASSWORD = "1234";

    document.addEventListener('DOMContentLoaded', function() {
        const empSelect = document.getElementById('empSelect');
        const newEmpInput = document.getElementById('newEmpInput');
        const addBtn = document.getElementById('addBtn');
        const delBtn = document.getElementById('delBtn');
        const resetBtn = document.getElementById('resetBtn');
        const inBtn = document.getElementById('inBtn');
        const outBtn = document.getElementById('outBtn');
        const logTable = document.getElementById('logTable');
        const gform = document.getElementById('gform');

        if (GOOGLE_SCRIPT_URL && GOOGLE_SCRIPT_URL !== "ضع_الرابط_هنا") {
            gform.action = GOOGLE_SCRIPT_URL;
        }

        // إضافة موظفة
        addBtn.addEventListener('click', function() {
            const pass = prompt('رمز الإدارة:');
            if (pass !== ADMIN_PASSWORD) return alert('رمز خاطئ');
            const name = newEmpInput.value.trim();
            if (!name) return alert('ادخلي الاسم');
            const option = document.createElement('option');
            option.value = name;
            option.textContent = name;
            empSelect.appendChild(option);
            empSelect.value = name;
            newEmpInput.value = '';
        });

        // حذف موظفة
        delBtn.addEventListener('click', function() {
            if (empSelect.options.length === 0) return;
            const pass = prompt('رمز الإدارة:');
            if (pass !== ADMIN_PASSWORD) return alert('رمز خاطئ');
            empSelect.remove(empSelect.selectedIndex);
        });

        // إلغاء حظر التسجيل لليوم
        resetBtn.addEventListener('click', function() {
            if (!empSelect.value) return;
            const pass = prompt('رمز الإدارة:');
            if (pass !== ADMIN_PASSWORD) return alert('رمز خاطئ');
            const today = new Date().toLocaleDateString('en-CA');
            localStorage.removeItem('att_' + empSelect.value + 'تسجيل دخول' + today);
            localStorage.removeItem('att_' + empSelect.value + 'تسجيل خروج' + today);
            alert('تم إلغاء الحظر للموظفة لليوم');
        });

        // معالجة تسجيل الحضور والانصراف
        function handleRegister(type) {
            const name = empSelect.value;
            if (!name) return alert('اختاري اسم الموظفة');

            const now = new Date();
            const todayDate = now.toLocaleDateString('en-CA'); // YYYY-MM-DD
            
            // صياغة الوقت والتاريخ بشكل واضح ومباشر باللغة العربية
            const dateFormatted = now.toLocaleDateString('ar-SA', { year: 'numeric', month: '2-digit', day: '2-digit' });
            const timeFormatted = now.toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
            const fullDateTime = dateFormatted + ' - ' + timeFormatted;

            const recordKey = 'att_' + name + '' + type + '' + todayDate;

            if (localStorage.getItem(recordKey)) {
                return alert('تم إجراء (' + type + ') للموظفة ' + name + ' اليوم بالفعل!');
            }

            // إرسال البيانات عبر النموذج الخفي لتفادي استبعاد الطلبات
            document.getElementById('form_employee').value = name;
            document.getElementById('form_type').value = type;
            document.getElementById('form_time').value = fullDateTime;
            
            if (gform.action && gform.action !== window.location.href) {
                gform.submit();
            }

            localStorage.setItem(recordKey, "true");

            if (logTable.rows[0] && logTable.rows[0].cells.length === 1) { 
                logTable.innerHTML = ''; 
            }

            const rowClass = type === 'تسجيل دخول' ? 'text-emerald-400' : 'text-rose-400';
            const rowHtml = '<tr class="hover:bg-slate-700/30 transition border-b border-slate-700/50">' +
                '<td class="py-3 font-bold text-white">' + name + '</td>' +
                '<td class="py-3 font-semibold ' + rowClass + '">' + type + '</td>' +
                '<td class="py-3 text-slate-300">' + fullDateTime + '</td>' +
            '</tr>';

            logTable.innerHTML = rowHtml + logTable.innerHTML;
            alert('تم ' + type + ' لـ ' + name + ' بنجاح!');
        }

        inBtn.addEventListener('click', function() { handleRegister('تسجيل دخول'); });
        outBtn.addEventListener('click', function() { handleRegister('تسجيل خروج'); });
    });
    </script>
</body>
</html
