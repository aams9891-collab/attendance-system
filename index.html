<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الحضور والانصراف - الصالون</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">

    <div class="bg-slate-800 p-6 rounded-2xl shadow-xl w-full max-w-md border border-slate-700">
        <h1 class="text-2xl font-bold text-center mb-6 text-amber-400">نظام الحضور والانصراف</h1>

        <!-- إدارة الموظفات -->
        <div class="mb-5 bg-slate-700/50 p-4 rounded-xl border border-slate-600">
            <label class="block text-slate-300 mb-2 font-bold text-sm">إدارة الموظفات (خاص بالإدارة):</label>
            <div class="flex gap-2 mb-3">
                <input type="text" id="newEmpInput" placeholder="اكتبي اسم الموظفة..." class="flex-1 p-2.5 rounded-lg bg-slate-800 text-white border border-slate-600 text-sm text-right">
                <button type="button" id="addBtn" class="bg-amber-500 hover:bg-amber-400 text-slate-900 font-bold px-4 py-2 rounded-lg text-sm">إضافة</button>
            </div>

            <div class="flex gap-2">
                <select id="empSelect" class="flex-1 p-2.5 rounded-lg bg-slate-800 text-white border border-slate-600 text-sm">
                    <option value="سارة">سارة</option>
                    <option value="نورة">نورة</option>
                    <option value="أمل">أمل</option>
                </select>
                <button type="button" id="delBtn" class="bg-rose-600 hover:bg-rose-500 text-white font-semibold px-3 py-2 rounded-lg text-xs">حذف</button>
                <button type="button" id="resetBtn" class="bg-amber-600 hover:bg-amber-500 text-white font-semibold px-3 py-2 rounded-lg text-xs">إلغاء الحظر</button>
            </div>
        </div>

        <!-- أزرار التسجيل -->
        <div class="grid grid-cols-2 gap-4 mb-6">
            <button type="button" id="inBtn" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl transition shadow-lg active:scale-95">
                تسجيل دخول
            </button>
            <button type="button" id="outBtn" class="bg-rose-600 hover:bg-rose-500 text-white font-bold py-3 rounded-xl transition shadow-lg active:scale-95">
                تسجيل خروج
            </button>
        </div>

        <!-- جدول السجلات -->
        <div class="overflow-x-auto">
            <table class="w-full text-right text-sm">
                <thead>
                    <tr class="text-slate-400 border-b border-slate-700">
                        <th class="py-2">الموظفة</th>
                        <th class="py-2">النوع</th>
                        <th class="py-2">الوقت والتاريخ</th>
                    </tr>
                </thead>
                <tbody id="logTable">
                    <tr>
                        <td colspan="3" class="py-4 text-center text-slate-500">لا توجد سجلات جديدة</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyl_4g0qEo_VhKOD4YhiGCtJ0yckOfNR1u1k3FgLi5jQtROpV48mIbksmFEjlIG2DBX/exec";
    const ADMIN_PASSWORD = "1234";

    document.addEventListener('DOMContentLoaded', function() {
        const empSelect = document.getElementById('empSelect');
        const newEmpInput = document.getElementById('newEmpInput');
        const addBtn = document.getElementById('addBtn');
        const delBtn = document.getElementById('delBtn');
        const resetBtn = document.getElementById('resetBtn');
        const inBtn = document.getElementById('inBtn');
        const outBtn = document.getElementById('outBtn');
        const logTable = document.getElementById('logTable');

        // إضافة موظفة
        addBtn.onclick = function() {
            const pass = prompt('رمز المرور بالإدارة:');
            if (pass !== ADMIN_PASSWORD) {
                if (pass !== null) alert('رمز المرور غير صحيح!');
                return;
            }
            const name = newEmpInput.value.trim();
            if (!name) return alert('اكتبي اسم الموظفة أولاً');
            const opt = document.createElement('option');
            opt.value = name;
            opt.textContent = name;
            empSelect.appendChild(opt);
            empSelect.value = name;
            newEmpInput.value = '';
            alert('تمت الإضافة: ' + name);
        };

        // حذف موظفة
        delBtn.onclick = function() {
            if (empSelect.options.length === 0) return;
            const pass = prompt('رمز المرور بالإدارة:');
            if (pass !== ADMIN_PASSWORD) {
                if (pass !== null) alert('رمز المرور غير صحيح!');
                return;
            }
            if (confirm('حذف الموظفة (' + empSelect.value + ')؟')) {
                empSelect.remove(empSelect.selectedIndex);
            }
        };

        // إلغاء حظر التسجيل لليوم
        resetBtn.onclick = function() {
            if (!empSelect.value) return;
            const pass = prompt('رمز المرور بالإدارة:');
            if (pass !== ADMIN_PASSWORD) {
                if (pass !== null) alert('رمز المرور غير صحيح!');
                return;
            }
            const name = empSelect.value;
            const today = new Date().toISOString().slice(0, 10);
            localStorage.removeItem('att_' + name + 'تسجيل دخول' + today);
            localStorage.removeItem('att_' + name + 'تسجيل خروج' + today);
            alert('تم إلغاء الحظر لـ (' + name + ') لليوم!');
        };

        // تسجيل الحضور أو الانصراف
        function register(type) {
            const name = empSelect.value;
            if (!name) return alert('اختاري الموظفة أولاً');

            const now = new Date();
            const todayStr = now.toISOString().slice(0, 10);
            const recordKey = 'att_' + name + '' + type + '' + todayStr;

            if (localStorage.getItem(recordKey)) {
                return alert('الموظفة (' + name + ') قامت بـ (' + type + ') اليوم بالفعل!');
            }

            const fullDateTime = now.toLocaleDateString('ar-SA') + ' - ' + now.toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });

            localStorage.setItem(recordKey, "true");

            // إرسال البيانات المباشر بدون محاولة تحويل أو إرسال GET فرعي
            if (GOOGLE_SCRIPT_URL) {
                fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ employee: name, type: type, time: fullDateTime })
                }).catch(function(err) { console.log(err); });
            }

            if (logTable.rows[0] && logTable.rows[0].cells.length === 1) {
                logTable.innerHTML = '';
            }

            const rowClass = type === 'تسجيل دخول' ? 'text-emerald-400' : 'text-rose-400';
            const rowHtml = '<tr class="border-b border-slate-700/50">' +
                '<td class="py-3 font-bold text-white">' + name + '</td>' +
                '<td class="py-3 font-semibold ' + rowClass + '">' + type + '</td>' +
                '<td class="py-3 text-slate-300">' + fullDateTime + '</td>' +
            '</tr>';

            logTable.innerHTML = rowHtml + logTable.innerHTML;
            alert('تم ' + type + ' لـ ' + name + ' بنجاح!');
        }

        inBtn.onclick = function() { register('تسجيل دخول'); };
        outBtn.onclick = function() { register('تسجيل خروج'); };
    });
    </script>
</body>
</html>
