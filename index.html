<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الحضور والانصراف</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-4 flex flex-col items-center">
    <div class="w-full max-w-md bg-slate-800 p-6 rounded-xl shadow-lg border border-slate-700">
        <h1 class="text-2xl font-bold text-center mb-6 text-amber-400">نظام الحضور والانصراف</h1>
        
        <div class="mb-6 border-b border-slate-700 pb-4">
            <label class="block text-sm font-medium mb-2">إدارة الموظفات (خاص بالإدارة):</label>
            <div class="flex gap-2 mb-2">
                <input type="text" id="newEmpInput" placeholder="اكتبي اسم الموظفة..." class="w-full p-2 rounded bg-slate-700 border border-slate-600 text-white text-sm">
                <button id="addBtn" class="bg-amber-500 hover:bg-amber-600 px-4 py-2 rounded text-black font-bold text-sm">إضافة</button>
            </div>
            <div class="flex gap-2">
                <select id="empSelect" class="w-full p-2 rounded bg-slate-700 border border-slate-600 text-white text-sm"></select>
                <button id="delBtn" class="bg-rose-500 hover:bg-rose-600 px-3 py-2 rounded text-white text-sm">حذف</button>
                <button id="resetBtn" class="bg-amber-600 hover:bg-amber-700 px-3 py-2 rounded text-white text-sm">إلغاء الحظر</button>
            </div>
        </div>

        <div class="flex gap-4 mb-6">
            <button id="inBtn" class="w-1/2 bg-emerald-500 hover:bg-emerald-600 py-3 rounded-lg font-bold text-lg">تسجيل دخول</button>
            <button id="outBtn" class="w-1/2 bg-rose-500 hover:bg-rose-600 py-3 rounded-lg font-bold text-lg">تسجيل خروج</button>
        </div>

        <div>
            <h2 class="font-bold mb-3 border-b border-slate-700 pb-1">السجل اليومي المحلي</h2>
            <table class="w-full text-right text-sm">
                <thead>
                    <tr class="text-slate-400 border-b border-slate-700">
                        <th class="pb-2">الموظفة</th>
                        <th class="pb-2">النوع</th>
                        <th class="pb-2">الوقت والتاريخ</th>
                    </tr>
                </thead>
                <tbody id="logTable">
                    <tr><td colspan="3" class="py-3 text-center text-slate-500">لا يوجد تسجيلات اليوم</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxVj-d0Y76P4IRUjskTyOsYInC7LWRqBpiPnMBEyzHd4eYQhvpsxLRH-9XJvnehs3TOnA/exec";
    const ADMIN_PASS = "1234";

    document.addEventListener('DOMContentLoaded', function() {
        const empSelect = document.getElementById('empSelect');
        const newEmpInput = document.getElementById('newEmpInput');
        const addBtn = document.getElementById('addBtn');
        const delBtn = document.getElementById('delBtn');
        const resetBtn = document.getElementById('resetBtn');
        const inBtn = document.getElementById('inBtn');
        const outBtn = document.getElementById('outBtn');
        const logTable = document.getElementById('logTable');

        if (addBtn) {
            addBtn.onclick = function() {
                if (prompt('رمز المرور:') !== ADMIN_PASS) return alert('خطأ!');
                const name = newEmpInput.value.trim();
                if (!name) return;
                const opt = document.createElement('option');
                opt.value = name; opt.textContent = name;
                empSelect.appendChild(opt); empSelect.value = name;
                newEmpInput.value = '';
            };
        }

        if (delBtn) {
            delBtn.onclick = function() {
                if (empSelect.options.length === 0) return;
                if (prompt('رمز المرور:') !== ADMIN_PASS) return alert('خطأ!');
                empSelect.remove(empSelect.selectedIndex);
            };
        }

        if (resetBtn) {
            resetBtn.onclick = function() {
                if (!empSelect.value) return;
                if (prompt('رمز المرور:') !== ADMIN_PASS) return alert('خطأ!');
                const today = new Date().toISOString().slice(0, 10);
                localStorage.removeItem('att_' + empSelect.value + 'تسجيل دخول' + today);
                localStorage.removeItem('att_' + empSelect.value + 'تسجيل خروج' + today);
                alert('تم إلغاء الحظر!');
            };
        }

        function register(type) {
            const name = empSelect.value;
            if (!name) return alert('اختاري الموظفة');

            const now = new Date();
            const todayStr = now.toISOString().slice(0, 10);
            const recordKey = 'att_' + name + '' + type + '' + todayStr;

            if (localStorage.getItem(recordKey)) {
                return alert('تم التسجيل اليوم بالفعل!');
            }

            const timeStr = now.toLocaleDateString('ar-SA') + ' - ' + now.toLocaleTimeString('ar-SA');
            localStorage.setItem(recordKey, "true");

            fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ employee: name, type: type, time: timeStr })
            });

            if (logTable && logTable.rows[0] && logTable.rows[0].cells.length === 1) logTable.innerHTML = '';
            const rowClass = type === 'تسجيل دخول' ? 'text-emerald-400' : 'text-rose-400';
            if (logTable) {
                logTable.innerHTML = '<tr class="border-b border-slate-700/50"><td class="py-3 font-bold text-white">' + name + '</td><td class="py-3 ' + rowClass + '">' + type + '</td><td class="py-3 text-slate-300">' + timeStr + '</td></tr>' + logTable.innerHTML;
            }
            alert('تم ' + type + ' بنجاح!');
        }

        if (inBtn) inBtn.onclick = function() { register('تسجيل دخول'); };
        if (outBtn) outBtn.onclick = function() { register('تسجيل خروج'); };
    });
    </script>
</body>
</html>
